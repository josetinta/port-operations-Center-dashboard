*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#04070d;font-family:'Inter',sans-serif;color:#e8e9ef}
#stage{position:absolute;left:0;top:0;width:1494px;height:840px;transform-origin:0 0;overflow:hidden;background:#070c16}
#stage>*,#dyn>*{position:absolute}
.bx>*{position:absolute}
svg{display:block;overflow:visible}
svg text{font-family:'Inter',sans-serif}
a{text-decoration:none;color:inherit}
.rw{cursor:pointer}
.mo{font-family:'Space Mono',monospace}
.cd{font-family:'Barlow Condensed','Arial Narrow',sans-serif}
.lb{font:600 11px 'Inter',sans-serif;letter-spacing:.3px;color:#8ea6c6;white-space:nowrap}
.tg{height:30px;line-height:30px;text-align:center;font:600 12px 'Inter',sans-serif;color:#8ea6c6;cursor:pointer;border-radius:8px;white-space:nowrap}
.tg:hover{color:#fff}
.tg.on{background:linear-gradient(180deg,#5b7aa3,#34507a);color:#fff}
.ib{display:flex;align-items:center;justify-content:center;border:1px solid #2c3f5e;background:#142033;border-radius:10px;color:#dfe0ea;cursor:pointer}
.ib:hover{border-color:#6a88b0;color:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #2c3f5e;background:#142033;border-radius:10px;color:#e6f0ff;font:600 12px 'Inter',sans-serif;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#6a88b0}
.btn.pr{background:linear-gradient(180deg,#5b7aa3,#34507a);border-color:#6a88b0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ecg{to{transform:translateX(-160px)}}
@keyframes pls{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
#tip{position:fixed;z-index:90;pointer-events:none;display:none;background:#34507a;color:#fff;font:600 11px 'Inter',sans-serif;padding:5px 9px;white-space:nowrap;border-radius:6px}
#tbl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
#tbl.show{display:flex}
#sheet{width:min(1240px,97vw);height:min(560px,90vh);background:#0c1424;border:1px solid #2c3f5e;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
#sheet .tp{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#142033;border-bottom:1px solid #2c3f5e}
#sheet .tp b{flex:1;font:700 14px 'Inter',sans-serif;color:#fff}
#sheet button{height:30px;padding:0 14px;border:1px solid #4b6a95;border-radius:8px;background:#16233b;color:#eee;font:600 11px 'Inter',sans-serif;cursor:pointer}
#sheet button:hover{border-color:#6a88b0}
#sheet .scr{flex:1;overflow:auto}
#sheet table{border-collapse:collapse;font:12.5px 'Space Mono',monospace;width:100%}
#sheet th{position:sticky;top:0;background:#142033;color:#b4c6dc;padding:8px 10px;text-align:right;white-space:nowrap;border:1px solid #2c3f5e;font-family:'Inter',sans-serif;font-size:11.5px}
#sheet td{padding:6px 10px;border:1px solid #0e3590;text-align:right;color:#e0ecff;white-space:nowrap}
#sheet th:first-child,#sheet td:first-child{text-align:left}
#sheet td[contenteditable]:focus{outline:2px solid #6a88b0;background:#16233b}
